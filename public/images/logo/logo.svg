<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" fill="none" width="100%" height="100%">
  <!-- Sacred Diya & Divine Mist Sacred Emblem -->
  <g transform="translate(15, 10)">
    <!-- Aura halo glow -->
    <circle cx="40" cy="40" r="38" fill="#F8F6ED" stroke="#C6A66A" stroke-width="1.2" stroke-dasharray="2 2" />
    <circle cx="40" cy="40" r="34" fill="none" stroke="#DDE8D5" stroke-width="1.5" />
    <circle cx="40" cy="40" r="30" fill="#183B2C" />

    <!-- Sacred Kalash / Diya Base -->
    <path d="M28 54 C28 58, 52 58, 52 54 L50 46 C50 44, 30 44, 30 46 Z" fill="#C6A66A" />
    <ellipse cx="40" cy="46" rx="10" ry="2.5" fill="#DFCA95" />

    <!-- Sacred Flame -->
    <path d="M40 22 C43 27, 47 34, 44 41 C42 45, 38 45, 36 41 C33 34, 37 27, 40 22 Z" fill="url(#goldGradient)" />
    <path d="M40 28 C41.5 32, 43 36, 42 39 C41 41, 39 41, 38 39 C37 36, 38.5 32, 40 28 Z" fill="#FFF8EB" />

    <!-- Spiraling Divine Incense Mist Ribbons -->
    <path d="M37 20 C35 15, 42 12, 44 8 C45 6, 43 4, 40 3" stroke="#DDE8D5" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <path d="M43 22 C47 16, 41 11, 46 6 C48 4, 46 2, 44 1" stroke="#C6A66A" stroke-width="1.2" stroke-linecap="round" fill="none" opacity="0.9" />

    <!-- Radiance dots -->
    <circle cx="40" cy="14" r="1.2" fill="#C6A66A" />
    <circle cx="26" cy="38" r="1" fill="#C6A66A" />
    <circle cx="54" cy="38" r="1" fill="#C6A66A" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(108, 12)">
    <!-- Primary Brand Name: AARADHYA -->
    <text x="0" y="38" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="34" font-weight="700" letter-spacing="7" fill="#183B2C">
      AARADHYA
    </text>

    <!-- Subtitle: DIVINE MIST -->
    <text x="3" y="58" font-family="'Inter', 'DM Sans', sans-serif" font-size="12" font-weight="600" letter-spacing="8" fill="#C6A66A">
      DIVINE MIST
    </text>

    <!-- Tagline: "Way to connect your Aaradhya" -->
    <text x="4" y="73" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif" font-size="12.5" font-style="italic" letter-spacing="1.5" fill="#526057">
      "Way to connect your Aaradhya"
    </text>
  </g>

  <!-- Gradients -->
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A58547" />
      <stop offset="50%" stop-color="#C6A66A" />
      <stop offset="100%" stop-color="#F2E3B3" />
    </linearGradient>
  </defs>
</svg>
