<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="100%" height="100%">
  <defs>
    <linearGradient id="storyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#183B2C" />
      <stop offset="100%" stop-color="#0F261C" />
    </linearGradient>
    <radialGradient id="storyAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DFCA95" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#183B2C" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="800" height="650" fill="url(#storyGrad)" />
  <rect x="25" y="25" width="750" height="600" fill="none" stroke="#C6A66A" stroke-width="1.2" stroke-opacity="0.4" />
  <circle cx="400" cy="325" r="220" fill="url(#storyAura)" />
  <!-- Sacred Kalash with Coconut and Mango Leaves -->
  <g transform="translate(400, 340)">
    <ellipse cx="0" cy="110" rx="90" ry="24" fill="#C6A66A" opacity="0.3" />
    <!-- Kalash Pot -->
    <path d="M-60 90 C-80 30, -50 -20, -35 -40 L35 -40 C50 -20, 80 30, 60 90 Z" fill="#C6A66A" stroke="#DFCA95" stroke-width="2" />
    <ellipse cx="0" cy="-40" rx="35" ry="10" fill="#DFCA95" />
    <!-- Sacred Swastika / Om motif -->
    <circle cx="0" cy="30" r="18" fill="#183B2C" stroke="#DFCA95" stroke-width="1" />
    <!-- Mango leaves -->
    <path d="M-30 -40 C-60 -90, -40 -120, -20 -100 Z" fill="#DDE8D5" stroke="#183B2C" />
    <path d="M30 -40 C60 -90, 40 -120, 20 -100 Z" fill="#DDE8D5" stroke="#183B2C" />
    <path d="M0 -40 C-15 -100, 15 -100, 0 -130 Z" fill="#C3D3B8" stroke="#183B2C" />
    <!-- Coconut -->
    <ellipse cx="0" cy="-70" rx="28" ry="34" fill="#5D4037" stroke="#DFCA95" stroke-width="1.5" />
    <!-- Incense smoke winding around -->
    <path d="M-80 50 C-120 0, -60 -60, -90 -120 C-120 -180, -40 -200, -80 -260" fill="none" stroke="#F8F6ED" stroke-width="2.5" stroke-linecap="round" opacity="0.75" />
  </g>
</svg>